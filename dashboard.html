<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIRMS Hotspot Dashboard — Industrial vs Natural Fire</title>
  <meta name="description" content="Interactive Leaflet map of NASA FIRMS thermal hotspots classified as Industrial or Natural Fire, with FRP anomaly detection." />

  <!-- ─── Leaflet CSS (the map library) ─── -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- ─── Google Fonts: Inter for a clean, modern look ─── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       CSS OVERVIEW
       ═══════════════════════════════════════════════════════════════════════
       The page has three layers:
         1. The map (fills the entire screen)
         2. A stats panel (top-left, over the map)
         3. A legend (bottom-right, over the map)
       We use CSS variables for consistent colors, and glassmorphism
       (backdrop-filter: blur) for a modern translucent look.
    */

    :root {
      /* Color palette — these are reused throughout the CSS and JS */
      --color-industrial: #e74c3c;       /* Red for industrial hotspots */
      --color-natural: #27ae60;          /* Green for natural fires */
      --color-alert-border: #f39c12;     /* Orange for abnormal spike border */
      --color-panel-bg: rgba(15, 23, 42, 0.88);  /* Dark semi-transparent */
      --color-panel-border: rgba(255, 255, 255, 0.08);
      --color-text: #f1f5f9;
      --color-text-muted: #94a3b8;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
    }

    /* ─── The map fills the viewport ─── */
    #map {
      width: 100vw;
      height: 100vh;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       STATS PANEL (top-left)
       ═══════════════════════════════════════════════════════════════════════
       Shows total counts and filter checkboxes.  Uses glassmorphism:
       a dark semi-transparent background + blur, so the map shows through
       subtly.  This is a common modern UI pattern.
    */
    #stats-panel {
      position: absolute;
      top: 12px;
      left: 56px;           /* offset to clear Leaflet's zoom buttons */
      z-index: 1000;        /* above the map tiles */
      background: var(--color-panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--color-panel-border);
      border-radius: 14px;
      padding: 18px 22px;
      color: var(--color-text);
      min-width: 220px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease;
    }

    #stats-panel:hover {
      transform: translateY(-2px);
    }

    #stats-panel h2 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--color-text-muted);
      margin-bottom: 14px;
    }

    /* Each stat row: a colored dot + label + count */
    .stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 14px;
      font-weight: 500;
    }

    .stat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .stat-count {
      margin-left: auto;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-divider {
      height: 1px;
      background: var(--color-panel-border);
      margin: 10px 0;
    }

    /* ─── Filter checkboxes ─── */
    .filter-section {
      margin-top: 6px;
    }

    .filter-section h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--color-text-muted);
      margin-bottom: 8px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    /* Custom checkbox styling — the browser default is ugly */
    .filter-row input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-text-muted);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .filter-row input[type="checkbox"]:checked {
      border-color: #60a5fa;
      background: #60a5fa;
    }

    /* The checkmark inside the checkbox */
    .filter-row input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 0px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       LEGEND (bottom-right)
       ═══════════════════════════════════════════════════════════════════════
       Explains what the marker colors and borders mean.
    */
    #legend {
      position: absolute;
      bottom: 28px;
      right: 12px;
      z-index: 1000;
      background: var(--color-panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--color-panel-border);
      border-radius: 14px;
      padding: 16px 20px;
      color: var(--color-text);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    #legend h3 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--color-text-muted);
      margin-bottom: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      font-size: 13px;
    }

    /* Small colored circles used as legend swatches */
    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-swatch.industrial {
      background: var(--color-industrial);
    }

    .legend-swatch.natural {
      background: var(--color-natural);
    }

    .legend-swatch.alert {
      background: transparent;
      border: 3px solid var(--color-alert-border);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       POPUP STYLING
       ═══════════════════════════════════════════════════════════════════════
       Leaflet popups appear when you click a marker.  We override the
       default white-box style to match our dark theme.
    */
    .leaflet-popup-content-wrapper {
      background: var(--color-panel-bg) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--color-panel-border) !important;
      border-radius: 12px !important;
      color: var(--color-text) !important;
      font-family: var(--font) !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
    }

    .leaflet-popup-tip {
      background: var(--color-panel-bg) !important;
    }

    .leaflet-popup-content {
      margin: 14px 16px !important;
      font-size: 13px !important;
      line-height: 1.6 !important;
    }

    .popup-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .popup-label {
      color: var(--color-text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .popup-value {
      font-weight: 600;
    }

    .popup-evidence {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--color-panel-border);
      font-size: 12px;
      color: var(--color-text-muted);
      line-height: 1.5;
    }

    .popup-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .popup-badge.industrial {
      background: rgba(231, 76, 60, 0.2);
      color: #f87171;
    }

    .popup-badge.natural {
      background: rgba(39, 174, 96, 0.2);
      color: #4ade80;
    }

    .popup-badge.alert {
      background: rgba(243, 156, 18, 0.2);
      color: #fbbf24;
    }

    /* ─── Loading overlay (shown while GeoJSON fetches) ─── */
    #loading {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 2000;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text);
      font-family: var(--font);
      transition: opacity 0.4s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- ─── Loading overlay ─── -->
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading hotspot data...</div>
  </div>

  <!-- ─── The map container (Leaflet renders into this div) ─── -->
  <div id="map"></div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       STATS PANEL
       ═══════════════════════════════════════════════════════════════════════
       The counts (id="stat-total", etc.) start at 0 and get filled in by
       JavaScript once the GeoJSON loads.
  -->
  <div id="stats-panel">
    <h2>Hotspot Summary</h2>

    <div class="stat-row">
      <span>Total Events</span>
      <span class="stat-count" id="stat-total">0</span>
    </div>

    <div class="stat-divider"></div>

    <div class="stat-row">
      <span class="stat-dot" style="background: var(--color-industrial)"></span>
      <span>Industrial</span>
      <span class="stat-count" id="stat-industrial">0</span>
    </div>

    <div class="stat-row">
      <span class="stat-dot" style="background: var(--color-natural)"></span>
      <span>Natural Fire</span>
      <span class="stat-count" id="stat-natural">0</span>
    </div>

    <div class="stat-row">
      <span class="stat-dot" style="background: var(--color-alert-border)"></span>
      <span>Abnormal Spikes</span>
      <span class="stat-count" id="stat-alerts">0</span>
    </div>

    <!-- Filter checkboxes to toggle layer visibility -->
    <div class="stat-divider"></div>
    <div class="filter-section">
      <h3>Filters</h3>
      <label class="filter-row">
        <input type="checkbox" id="chk-industrial" checked />
        <span>Show Industrial</span>
      </label>
      <label class="filter-row">
        <input type="checkbox" id="chk-natural" checked />
        <span>Show Natural Fire</span>
      </label>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       LEGEND
       ═══════════════════════════════════════════════════════════════════════
  -->
  <div id="legend">
    <h3>Legend</h3>
    <div class="legend-item">
      <span class="legend-swatch industrial"></span>
      <span>Industrial</span>
    </div>
    <div class="legend-item">
      <span class="legend-swatch natural"></span>
      <span>Natural Fire</span>
    </div>
    <div class="legend-item">
      <span class="legend-swatch alert"></span>
      <span>Abnormal FRP spike</span>
    </div>
  </div>

  <!-- ─── Leaflet JS ─── -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ═════════════════════════════════════════════════════════════════════════
    // JAVASCRIPT OVERVIEW
    // ═════════════════════════════════════════════════════════════════════════
    // This script does four things:
    //   1. Creates a Leaflet map with a dark-themed tile layer
    //   2. Fetches data/firms_final.geojson
    //   3. Renders each point as a colored circle marker on the map
    //   4. Wires up the stats panel and filter checkboxes
    //
    // KEY CONCEPTS FOR BEGINNERS:
    //   - Leaflet is a JavaScript library that renders interactive maps
    //   - A "tile layer" is the background map imagery (streets, terrain)
    //   - A "layer group" is a collection of markers you can show/hide together
    //   - GeoJSON is a standard format for geographic data (points, polygons)
    //   - A "circle marker" is a dot drawn on the map at a lat/lon coordinate

    // ─── 1. CREATE THE MAP ───────────────────────────────────────────────────
    // L.map() initializes a Leaflet map inside the element with id="map".
    // setView([lat, lon], zoom) centers it on Korba/Chhattisgarh at zoom 10.
    const map = L.map('map').setView([22.35, 82.7], 10);

    // Add a dark-themed tile layer from CartoDB.  Tile layers are made of
    // 256x256 pixel images ("tiles") that the browser downloads as you pan
    // and zoom.  {z}/{x}/{y} are replaced with the current zoom level and
    // tile coordinates.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a> | ' +
                   '&copy; <a href="https://openstreetmap.org/">OSM</a>',
      maxZoom: 18,
      subdomains: 'abcd'
    }).addTo(map);

    // ─── 2. LAYER GROUPS ─────────────────────────────────────────────────────
    // We create two separate "layer groups" — one for Industrial markers and
    // one for Natural Fire markers.  This lets us toggle them independently
    // using the checkboxes in the stats panel.
    //
    // Think of a layer group like a folder: all markers inside it can be
    // shown or hidden with a single command.
    const industrialLayer = L.layerGroup().addTo(map);
    const naturalLayer    = L.layerGroup().addTo(map);

    // ─── 3. FETCH AND RENDER THE GeoJSON ─────────────────────────────────────
    // fetch() is the modern browser API for HTTP requests.  It returns a
    // Promise — an object that represents "a value that will arrive later".
    // .then() runs a callback when the Promise resolves (data arrives).
    fetch('data/firms_final.geojson')
      .then(response => {
        if (!response.ok) throw new Error('Failed to load GeoJSON: ' + response.status);
        return response.json();  // Parse the JSON text into a JS object
      })
      .then(geojson => {
        // ── Count statistics ──
        // We loop through all features once to count Industrial vs Natural
        // and Abnormal spikes.  These numbers go into the stats panel.
        let total = 0, industrial = 0, natural = 0, alerts = 0;

        geojson.features.forEach(feature => {
          const p = feature.properties;  // shorthand
          total++;

          if (p.final_label === 'Industrial') industrial++;
          else natural++;

          if (p.alert_flag === 'Abnormal spike') alerts++;

          // ── Create the circle marker ──
          // GeoJSON coordinates are [longitude, latitude] but Leaflet's
          // L.circleMarker expects [latitude, longitude].  We swap them.
          const coords = feature.geometry.coordinates;  // [lon, lat]
          const latLng = [coords[1], coords[0]];        // [lat, lon]

          const isIndustrial = p.final_label === 'Industrial';
          const isAlert      = p.alert_flag === 'Abnormal spike';

          // Marker radius scales with FRP (fire intensity).
          // Base radius of 4, plus frp/20, clamped between 4 and 18 pixels.
          // Math.min/Math.max ensure the radius stays in a readable range.
          const radius = Math.min(18, Math.max(4, 4 + p.frp / 20));

          // Marker color: red for Industrial, green for Natural Fire.
          const fillColor = isIndustrial ? '#e74c3c' : '#27ae60';

          // Abnormal spike markers get a thick orange border to stand out.
          // Normal markers get a thin semi-transparent white border.
          const borderColor  = isAlert ? '#f39c12' : 'rgba(255,255,255,0.3)';
          const borderWeight = isAlert ? 3 : 1;

          // L.circleMarker() draws a circle with fixed pixel radius
          // (as opposed to L.circle which draws in real-world meters).
          const marker = L.circleMarker(latLng, {
            radius:      radius,
            fillColor:   fillColor,
            fillOpacity: 0.75,
            color:       borderColor,
            weight:      borderWeight,
            opacity:     1
          });

          // ── Build the popup HTML ──
          // When you click a marker, this HTML appears in a small tooltip.
          // It shows the classification, date, FRP, and the evidence string.
          const labelClass = isIndustrial ? 'industrial' : 'natural';
          const frpDev = p.frp_deviation !== null
            ? `${p.frp_deviation.toFixed(2)}× cluster avg`
            : 'N/A (no cluster)';

          let popupHTML = `
            <div class="popup-title">
              <span class="popup-badge ${labelClass}">${p.final_label}</span>
              ${isAlert ? '<span class="popup-badge alert">⚠ Spike</span>' : ''}
            </div>
            <div style="margin-top: 8px;">
              <span class="popup-label">Date</span><br>
              <span class="popup-value">${p.acq_date}</span>
            </div>
            <div style="margin-top: 6px;">
              <span class="popup-label">FRP (Fire Radiative Power)</span><br>
              <span class="popup-value">${p.frp.toFixed(1)} MW</span>
              <span style="color: var(--color-text-muted); font-size: 12px;">
                (${frpDev})
              </span>
            </div>
            <div class="popup-evidence">
              <span class="popup-label">Evidence</span><br>
              ${p.evidence}
            </div>
          `;

          marker.bindPopup(popupHTML, { maxWidth: 320 });

          // Add the marker to the appropriate layer group so it can be
          // toggled on/off with the checkbox.
          if (isIndustrial) {
            industrialLayer.addLayer(marker);
          } else {
            naturalLayer.addLayer(marker);
          }
        });

        // ── Update the stats panel numbers ──
        document.getElementById('stat-total').textContent      = total.toLocaleString();
        document.getElementById('stat-industrial').textContent = industrial.toLocaleString();
        document.getElementById('stat-natural').textContent    = natural.toLocaleString();
        document.getElementById('stat-alerts').textContent     = alerts.toLocaleString();

        // ── Hide the loading overlay ──
        document.getElementById('loading').classList.add('hidden');
      })
      .catch(error => {
        console.error('Error loading GeoJSON:', error);
        document.getElementById('loading').innerHTML =
          `<div style="color: #f87171; font-size: 16px;">
             Failed to load data.<br>
             <span style="font-size: 13px; color: #94a3b8;">
               Make sure data/firms_final.geojson exists.<br>
               Run: python3 finalize_and_export.py
             </span>
           </div>`;
      });

    // ─── 4. FILTER CHECKBOXES ────────────────────────────────────────────────
    // When a checkbox is toggled, we add or remove the corresponding layer
    // group from the map.  This is much faster than recreating markers
    // because the markers already exist in memory — we just show/hide the
    // entire group.
    document.getElementById('chk-industrial').addEventListener('change', function() {
      if (this.checked) {
        map.addLayer(industrialLayer);
      } else {
        map.removeLayer(industrialLayer);
      }
    });

    document.getElementById('chk-natural').addEventListener('change', function() {
      if (this.checked) {
        map.addLayer(naturalLayer);
      } else {
        map.removeLayer(naturalLayer);
      }
    });
  </script>
</body>
</html>
